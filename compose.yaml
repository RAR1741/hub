# Root-level one-command local stack. Nothing but Docker is needed on the host.
#
#   docker compose up          # build + start everything, streaming logs
#   docker compose up -d       # …in the background
#   docker compose down        # stop the app container AND local Supabase
#   ./dev                      # same stack, then drop into a shell / run one-off commands
#
# `up` builds/starts the app container and runs scripts/dev-up.sh inside it, which
# brings up local Supabase (sibling containers) and the Next.js dev server together.
# App: http://localhost:3000 · Supabase Studio: http://localhost:54323
name: ${COMPOSE_PROJECT_NAME:-team-hub}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/workspaces/hub:cached
      # Host Docker socket: lets the Supabase CLI start sibling containers.
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspaces/hub
    # Docker Desktop mounts /var/run/docker.sock as root:root (no distinct "docker"
    # group GID to join), so the non-root "node" user can't reach it. Run as root
    # to keep docker-outside-of-docker working.
    user: root
    environment:
      # Host path of the repo, for tooling that bind-mounts into sibling containers.
      LOCAL_WORKSPACE_FOLDER: ${LOCAL_WORKSPACE_FOLDER:-}
      # Per-worktree Supabase DB port (see scripts/new-worktree.sh), read by
      # `npm run db:reset`/`db:psql` since the sibling Supabase containers
      # publish on this worktree's own port block, not the default 54322.
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-54322}
    extra_hosts:
      # Provided automatically by Docker Desktop; declared for Linux hosts too.
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3000}:3000"
    command: ["bash", "/workspaces/hub/scripts/dev-up.sh"]
    # Give scripts/dev-up.sh's SIGTERM trap time to run `supabase stop` on `down`.
    stop_grace_period: 60s
